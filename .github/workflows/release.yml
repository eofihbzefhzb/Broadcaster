name: Build Release
on:
  workflow_dispatch:
  push:
    branches:
      - "master"
    paths-ignore:
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'
      - '.github/**'
      - '!.github/workflows/release.yml'

env:
  DOCKER_OWNER: ${{ github.repository_owner }}
  DOCKER_CONTAINER: standalone
  DOCKER_TAG: ${{ github.ref_name }}

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@v5

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: 25
        distribution: temurin

    - name: Get previous build number
      id: getPreviousBuild
      run: | 
        PREVIOUS_BUILD=$(git tag --list | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
        echo result=${PREVIOUS_BUILD:-0} >> $GITHUB_OUTPUT

    - name: Get current build number
      id: getCurrentBuild
      if: success()
      env:
        PREVIOUS_BUILD: ${{ steps.getPreviousBuild.outputs.result }}
      run: echo result=$((PREVIOUS_BUILD + 1)) >> $GITHUB_OUTPUT

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
      with:
        gradle-home-cache-cleanup: true

    - name: Build
      run: ./gradlew build
      env:
        BUILD_NUMBER: ${{ steps.getCurrentBuild.outputs.result }}

    - uses: actions/upload-artifact@v7
      if: success()
      with:
        name: MCXboxBroadcastStandalone
        path: bootstrap/standalone/build/libs/MCXboxBroadcastStandalone.jar
        if-no-files-found: error

    - name: Bump version and push tag
      id: tag_version
      uses: mathieudutour/github-tag-action@v6.2
      if: ${{ success() && github.ref_name == 'master' }}
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        tag_prefix: ''
        custom_tag: ${{ steps.getCurrentBuild.outputs.result }}

    - name: Generate release diff
      if: ${{ success() && github.ref_name == 'master' }}
      # Only what is new since the previous build. "git log -n 50" listed the last fifty commits
      # no matter what had already been published, so every release repeated the entries of the
      # ones before it and the notes grew without ever dropping anything.
      env:
        PREVIOUS_BUILD: ${{ steps.getPreviousBuild.outputs.result }}
      run: |
        git fetch --tags --force
        if [ "$PREVIOUS_BUILD" != "0" ] && git rev-parse -q --verify "refs/tags/$PREVIOUS_BUILD" > /dev/null; then
          git log "$PREVIOUS_BUILD"..HEAD --pretty=format:"* %s (%h)" > release_notes.md
        else
          # No earlier tag to diff against, e.g. the very first release of this fork.
          git log -n 50 --pretty=format:"* %s (%h)" > release_notes.md
        fi
        if [ ! -s release_notes.md ]; then
          echo "* No code changes since build $PREVIOUS_BUILD" > release_notes.md
        fi

    - name: Create release
      uses: ncipollo/release-action@v1
      if: ${{ success() && github.ref_name == 'master' }}
      with:
        artifacts: "bootstrap/standalone/build/libs/MCXboxBroadcastStandalone.jar,egg-m-c-xbox-broadcast.json"
        allowUpdates: true
        bodyFile: "release_notes.md"
        draft: false
        prerelease: false
        name: Build ${{ steps.getCurrentBuild.outputs.result }} (${{ github.ref_name }})
        tag: ${{ steps.getCurrentBuild.outputs.result }}
        token: ${{ secrets.GITHUB_TOKEN }}

  docker-standalone:
    needs: build
    runs-on: ubuntu-latest
    # Upstream publishes a container image to GHCR. A fork's GITHUB_TOKEN cannot create the package
    # ("denied: installation not allowed to Create organization package"), so this job can only ever
    # fail here - and it marked every otherwise successful release as failed, which hides real
    # breakage. Restricted to the upstream repository; the standalone jar on the release is what
    # this fork actually ships.
    if: ${{ github.repository == 'MCXboxBroadcast/Broadcaster' }}
    steps:
      - uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          name: MCXboxBroadcastStandalone
          path: bootstrap/standalone/build/libs

      - name: Make environment variables lowercase
        run: |
          echo "DOCKER_OWNER=$(echo $DOCKER_OWNER | tr '[A-Z]' '[a-z]')" >> $GITHUB_ENV
          echo "DOCKER_CONTAINER=$(echo $DOCKER_CONTAINER | tr '[A-Z]' '[a-z]')" >> $GITHUB_ENV
          echo "DOCKER_TAG=$(echo $DOCKER_TAG | tr '[A-Z]' '[a-z]')" >> $GITHUB_ENV

      - name: Fix Docker tag format
        run: |
          # Replace / with _
          echo "DOCKER_TAG=$(echo $DOCKER_TAG | sed -e 's/\//_/g')" >> $GITHUB_ENV

      - name: Set Docker container tags
        run: |
          DOCKER_TAGS="ghcr.io/$DOCKER_OWNER/$DOCKER_CONTAINER:$DOCKER_TAG"
          [[ "${{ github.ref }}" == "refs/heads/master" ]] && DOCKER_TAGS="$DOCKER_TAGS,ghcr.io/$DOCKER_OWNER/$DOCKER_CONTAINER:latest"

          echo "DOCKER_TAGS=$DOCKER_TAGS" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: bootstrap/standalone/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.DOCKER_TAGS }}